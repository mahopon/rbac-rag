<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Parser</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 { margin-top: 0; }
        form { display: flex; flex-direction: column; gap: 1rem; }
        label { font-weight: bold; }
        input[type="file"] { padding: 0.5rem; }
        button {
            padding: 0.75rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #status { margin-top: 1rem; white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PDF Parser</h1>
        <form id="pdfForm">
            <label for="pdfFile">Select PDF file:</label>
            <input type="file" id="pdfFile" accept=".pdf" required />
            <button type="submit" id="submitBtn">Upload &amp; Parse</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const form = document.getElementById('pdfForm');
        const fileInput = document.getElementById('pdfFile');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const ENDPOINT = 'http://localhost:8000/pdf';  // <-- change to your endpoint

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Parsing...';
            statusDiv.textContent = '';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(ENDPOINT, {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // Adjust based on your API response format
                const result = await response.text();   // or .json() if it returns JSON
                statusDiv.textContent = result;
            } catch (err) {
                statusDiv.textContent = `Error: ${err.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Upload &amp; Parse';
            }
        });
    </script>
</body>
</html>
